<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#090d16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <title>HomeGuard Security</title>
  <style>
    :root {
      --bg: #090d16; --surface: #131b2e; --surface-light: #1c2742;
      --text: #f8fafc; --muted: #94a3b8; --green: #10b981;
      --green-glow: rgba(16, 185, 129, 0.18); --red: #ef4444;
      --red-glow: rgba(239, 68, 68, 0.22); --blue: #38bdf8; --accent: #6366f1;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; justify-content: center;
    }
    .app-container {
      width: 100%; max-width: 460px; padding: 24px 20px; display: flex; flex-direction: column; gap: 18px;
    }
    #lockScreen {
      position: fixed; inset: 0; background: var(--bg); z-index: 100;
      display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px;
    }
    .lock-icon { font-size: 3rem; margin-bottom: 12px; }
    .lock-title { font-size: 1.4rem; font-weight: 700; margin-bottom: 6px; }
    .lock-sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 24px; }
    .pin-dots { display: flex; gap: 14px; margin-bottom: 28px; }
    .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--muted); transition: 0.2s; }
    .dot.filled { background: var(--accent); border-color: var(--accent); }
    .keypad { display: grid; grid-template-columns: repeat(3, 72px); gap: 16px; }
    .key {
      height: 72px; border-radius: 50%; border: none; background: var(--surface); color: var(--text);
      font-size: 1.5rem; font-weight: 600; cursor: pointer; touch-action: manipulation;
    }
    .key:active { background: var(--accent); }
    .key.empty { background: transparent; cursor: default; }
    .header { display: flex; justify-content: space-between; align-items: center; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand h1 { font-size: 1.3rem; margin: 0; font-weight: 700; }
    .status-pill {
      display: flex; align-items: center; gap: 6px; font-size: 0.78rem; font-weight: 600;
      padding: 6px 12px; border-radius: 999px; background: var(--surface); color: var(--muted);
    }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    .status-pill.online { background: var(--green-glow); color: var(--green); }
    .status-pill.online .status-dot { background: var(--green); box-shadow: 0 0 8px var(--green); }
    .card {
      background: var(--surface); border-radius: 20px; padding: 20px;
      border: 1px solid rgba(255, 255, 255, 0.05); box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }
    .banner { border-left: 4px solid var(--green); transition: all 0.3s ease; }
    .banner.alert { border-left-color: var(--red); background: linear-gradient(135deg, var(--surface), var(--red-glow)); }
    .label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1.1px; color: var(--muted); font-weight: 600; }
    .banner-msg { font-size: 1.2rem; font-weight: 700; margin-top: 6px; }
    .timestamp { font-size: 0.75rem; color: var(--muted); margin-top: 8px; }
    .door-box { display: flex; justify-content: space-between; align-items: center; padding: 24px 20px; }
    .door-state { font-size: 2.1rem; font-weight: 800; margin-top: 4px; color: var(--green); }
    .door-state.open { color: var(--red); }
    .door-badge-icon {
      width: 64px; height: 64px; border-radius: 18px; background: var(--green-glow);
      display: flex; align-items: center; justify-content: center; font-size: 2rem;
    }
    .door-badge-icon.open { background: var(--red-glow); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .metric-val { font-size: 1.9rem; font-weight: 800; margin-top: 8px; color: var(--blue); }
    .metric-unit { font-size: 1rem; color: var(--muted); font-weight: 500; }
    .footer { text-align: center; margin-top: auto; }
    .lock-btn {
      background: var(--surface-light); color: var(--text); border: none;
      padding: 10px 18px; border-radius: 12px; font-size: 0.85rem; font-weight: 600; cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="lockScreen">
    <div class="lock-icon">🛡️</div>
    <div class="lock-title">HomeGuard</div>
    <div class="lock-sub" id="lockSub">Enter 4-digit PIN (1234)</div>
    <div class="pin-dots">
      <div class="dot" id="d0"></div><div class="dot" id="d1"></div>
      <div class="dot" id="d2"></div><div class="dot" id="d3"></div>
    </div>
    <div class="keypad">
      <button type="button" class="key" data-num="1">1</button>
      <button type="button" class="key" data-num="2">2</button>
      <button type="button" class="key" data-num="3">3</button>
      <button type="button" class="key" data-num="4">4</button>
      <button type="button" class="key" data-num="5">5</button>
      <button type="button" class="key" data-num="6">6</button>
      <button type="button" class="key" data-num="7">7</button>
      <button type="button" class="key" data-num="8">8</button>
      <button type="button" class="key" data-num="9">9</button>
      <button type="button" class="key empty"></button>
      <button type="button" class="key" data-num="0">0</button>
      <button type="button" class="key" id="clearBtn">⌫</button>
    </div>
  </div>

  <div class="app-container">
    <div class="header">
      <div class="brand"><span style="font-size: 1.5rem;">🏡</span><h1>HomeGuard</h1></div>
      <div id="connPill" class="status-pill"><span class="status-dot"></span><span id="connText">Connecting</span></div>
    </div>
    <div id="bannerCard" class="card banner">
      <div class="label">Latest Activity</div>
      <div id="bannerMsg" class="banner-msg">Waiting for ESP32...</div>
      <div id="lastUpdated" class="timestamp">Last sync: --</div>
    </div>
    <div class="card door-box">
      <div><div class="label">Front Door Sensor</div><div id="doorState" class="door-state">--</div></div>
      <div id="doorIconBox" class="door-badge-icon">🚪</div>
    </div>
    <div class="grid">
      <div class="card"><div class="label">🌡️ Temperature</div><div class="metric-val"><span id="tempVal">--</span><span class="metric-unit"> °C</span></div></div>
      <div class="card"><div class="label">💧 Humidity</div><div class="metric-val"><span id="humVal">--</span><span class="metric-unit"> %</span></div></div>
    </div>
    <div class="footer"><button type="button" class="lock-btn" id="lockBtn">🔒 Lock Dashboard</button></div>
  </div>

  <script>
    const APP_PIN = "1234";
    let enteredPin = "";
    const lockScreen = document.getElementById("lockScreen");
    const lockSub = document.getElementById("lockSub");

    if (sessionStorage.getItem("unlocked") === "true") lockScreen.style.display = "none";

    function updateDots() {
      for (let i = 0; i < 4; i++) {
        document.getElementById("d" + i).classList.toggle("filled", i < enteredPin.length);
      }
    }

    document.querySelectorAll(".key[data-num]").forEach(btn => {
      btn.addEventListener("click", () => {
        if (enteredPin.length < 4) {
          enteredPin += btn.getAttribute("data-num");
          updateDots();
          if (enteredPin.length === 4) {
            if (enteredPin === APP_PIN) {
              sessionStorage.setItem("unlocked", "true");
              lockScreen.style.display = "none";
            } else {
              lockSub.textContent = "❌ Wrong PIN. Try again.";
              lockSub.style.color = "#ef4444";
              setTimeout(() => {
                enteredPin = ""; updateDots();
                lockSub.textContent = "Enter 4-digit PIN (1234)";
                lockSub.style.color = "#94a3b8";
              }, 600);
            }
          }
        }
      });
    });

    document.getElementById("clearBtn").addEventListener("click", () => {
      enteredPin = enteredPin.slice(0, -1); updateDots();
    });

    document.getElementById("lockBtn").addEventListener("click", () => {
      sessionStorage.removeItem("unlocked"); enteredPin = ""; updateDots();
      lockScreen.style.display = "flex";
    });
  </script>

  <script src="https://jsdelivr.net"></script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');

    // ✅ Standard Port 443 Secure WebSocket Broker
    const BROKER_URL = "wss://mqtt.eclipseprojects.io:443/mqtt";
    const MQTT_TOPIC = "homeguard/secret_847291_mm/status";

    if (typeof mqtt !== "undefined") {
      const client = mqtt.connect(BROKER_URL, {
        clientId: "web_" + Math.random().toString(16).substr(2, 8),
        clean: true,
        reconnectPeriod: 3000
      });
      const connPill = document.getElementById("connPill");
      const connText = document.getElementById("connText");

      client.on("connect", () => {
        connPill.classList.add("online");
        connText.textContent = "Live";
        client.subscribe(MQTT_TOPIC);
      });

      client.on("message", (topic, message) => {
        try {
          const data = JSON.parse(message.toString());
          const doorState = document.getElementById("doorState");
          const doorIconBox = document.getElementById("doorIconBox");
          doorState.textContent = data.door;
          doorState.classList.toggle("open", data.door === "OPEN");
          doorIconBox.classList.toggle("open", data.door === "OPEN");
          doorIconBox.textContent = data.door === "OPEN" ? "🔓" : "🔒";

          document.getElementById("bannerMsg").textContent = data.banner;
          document.getElementById("bannerCard").classList.toggle("alert", data.alarm === true);
document.getElementById("tempVal").textContent = Number(data.temp).toFixed(1);
document.getElementById("humVal").textContent = Number(data.hum).toFixed(1);
document.getElementById("lastUpdated").textContent = "Last sync: " + new Date().toLocaleTimeString();
} catch (err) { console.error(err); }
});
client.on("error", (err) => {
connText.textContent = "Err: " + err.message;
});
client.on("offline", () => {
connPill.classList.remove("online");
connText.textContent = "Offline";
});
} else {
document.getElementById("connText").textContent = "CDN Blocked";
}
